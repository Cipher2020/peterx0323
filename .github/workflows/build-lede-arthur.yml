name: build-lede-arthur
on:
  workflow_dispatch:
  repository_dispatch:

env:
  REPO_URL: https://github.com/Cipher2020/lede2502
  REPO_BRANCH: 202502
  CONFIG_FILE: xunlei/.config
  DIY_P1: xunlei/diy-part1.sh
  DIY_P2: xunlei/diy-part2.sh
  TZ: Asia/Shanghai
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 4G
  UPLOAD_FIRMWARE: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clean disk manually
        run: |
          echo "==== Before Clean ===="
          df -hT
          free -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /var/lib/docker
          sudo apt autoremove -y
          sudo apt clean
          echo "==== After Clean ===="
          df -hT
          free -h
          # git网络优化
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600
          git config --global core.compression 0

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99nolang
          sudo apt update -qq
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools \
          libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
          vim wget xmlto xxd zlib1g-dev python3-setuptools libfuse-dev
          sudo rm -rf /var/lib/apt/lists/*
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-lede-ccache

      - name: Clone OpenWrt source
        run: |
          git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "SOURCE_ROOT=$PWD" >> $GITHUB_ENV
          free -h
          df -hT

      - name: DIY part1 (feeds更新、替换golang、删除内置包逻辑放diy‑part1.sh)
        run: |
          chmod +x $DIY_P1
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1
          free -h
          df -hT

      - name: Load config & DIY part2 【提前，先生成.config】
        run: |
          rm -rf openwrt/feeds/smpackage/msd_lite
          [ -e files ] && mv files openwrt/
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2

      - name: Feeds install 根据.config选中包安装，带空判断防exit code 2
        run: |
          cd openwrt
          PKG_LIST=$(cat .config 2>/dev/null | grep '^CONFIG_PACKAGE_' | sed 's/CONFIG_PACKAGE_//g' | sed 's/=y//' | sed 's/=m//' | grep -v '^#' | tr '\n' ' ')
          if [ -z "$PKG_LIST" ]; then
            echo "WARNING: no package list, skip feeds install"
          else
            ./scripts/feeds install $PKG_LIST
          fi
          free -h
          df -hT

      - name: Download dl packages
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -delete
          df -hT
          free -h

      - name: Compile firmware
        run: |
          cd openwrt
          make -j1 V=s
          FIRMWARE_DIR=$(find bin/targets -maxdepth 2 -type d | tail -n1)
          if [ ! -d "$FIRMWARE_DIR" ]; then
            echo "ERROR: Firmware folder not found!"
            exit 1
          fi
          echo "FIRMWARE_DIR=$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "FIRMWARE_ROOT=$PWD" >> $GITHUB_ENV
          DEV_NAME=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -E 's/.*DEVICE_(.*)=y/\1/')
          echo "DEVICE_NAME=$DEV_NAME" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Clean packages folder
        run: |
          cd ${{ env.FIRMWARE_DIR }}
          rm -rf packages
          ls -lh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_FIRMWARE == 'true'
        with:
          name: firmware-${{ env.DEVICE_NAME }}-${{ env.BUILD_TIME }}
          path: ${{ env.FIRMWARE_DIR }}

      - name: Delete old runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3
